; /etc/php-fpm.d/www.conf —— 只列出调过的项，其余保持默认
; 校验：php-fpm -t    重载：systemctl reload php-fpm
;
; pm.max_children 怎么算：
;   单进程常驻约 40 MB，机器 4 GB，留 1 GB 给系统 → 3072 / 40 ≈ 76
;   先按 76 跑，压测时看 free -h 与 php-fpm 总 RSS，再往下调；宁小勿大，OOM 比 502 难查

[www]
user = nginx
group = nginx

listen = 0.0.0.0:9000
listen.allowed_clients = 192.168.56.11
listen.backlog = 511

pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.max_requests = 500

; 慢请求落盘：超过 5s 把 PHP 调用栈打出来，直接指向慢的那一行
request_slowlog_timeout = 5s
slowlog = /var/log/php-fpm/www-slow.log

; 与 nginx 的 fastcgi_read_timeout 对齐，避免 nginx 判 504、php 还在跑
request_terminate_timeout = 30s

; 进程被 OOM 杀之前先留下证据
catch_workers_output = yes

php_admin_value[error_log] = /var/log/php-fpm/www-error.log
php_admin_flag[log_errors] = on
php_value[upload_max_filesize] = 20M
php_value[post_max_size] = 20M
php_value[date.timezone] = Asia/Shanghai
