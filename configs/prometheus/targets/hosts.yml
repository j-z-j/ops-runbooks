# /etc/prometheus/targets/hosts.yml —— node_exporter 目标（file_sd 自动热加载）
# 加机器只改这个文件，30 秒内生效，不需要重启 Prometheus

- targets: ['192.168.56.11:9100']
  labels:
    instance: web-01
    role: nginx
    env: prod
    owner: ops

- targets: ['192.168.56.12:9100']
  labels:
    instance: app-01
    role: php
    env: prod
    owner: ops

- targets: ['192.168.56.13:9100']
  labels:
    instance: db-01
    role: mysql-master
    env: prod
    owner: dba

- targets: ['192.168.56.14:9100']
  labels:
    instance: db-02
    role: mysql-slave
    env: prod
    owner: dba
