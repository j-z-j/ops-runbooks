# /etc/prometheus/prometheus.yml —— 4 台主机 + 中间件 + 业务探活
# 校验：promtool check config /etc/prometheus/prometheus.yml
# 热加载：curl -X POST http://127.0.0.1:9090/-/reload

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: lnmp-lab
    env: prod

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['192.168.56.15:9093']
      timeout: 10s
      api_version: v2

scrape_configs:
  # 主机指标：目标列表用文件维护，改完 30 秒内自动生效，不用重启
  - job_name: node
    file_sd_configs:
      - files: ['/etc/prometheus/targets/hosts.yml']
        refresh_interval: 30s

  # MySQL：mysqld_exporter 需要 --config.my-cnf 提供账号
  - job_name: mysql
    static_configs:
      - targets: ['192.168.56.13:9104', '192.168.56.14:9104']

  # 业务 URL 探活 + 证书到期：blackbox 的 relabel 三件套（__param_target / instance / __address__）
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ['/etc/prometheus/targets/urls.yml']
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
